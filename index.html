<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشتلتي</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#eef3e8;padding-bottom:130px}header{background:#1b4332;color:#fff;padding:12px;position:sticky;top:0;z-index:10}h1{font-size:13px}.row{display:flex;gap:4px;margin-top:6px}.pill{background:rgba(255,255,255,.2);padding:5px;border-radius:8px;flex:1;text-align:center;font-size:9px}.pill b{display:block;font-size:12px}section{padding:8px}nav{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}nav button{flex:1;padding:8px 2px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:9px;font-weight:700;min-width:50px}nav button.on{background:#1b4332;color:#fff}input[type=search]{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;margin-bottom:6px}.card{background:#fff;border-radius:10px;padding:10px;margin-bottom:6px;border-right:4px solid #1b4332}.top{display:flex;justify-content:space-between}.badge{padding:3px 7px;border-radius:20px;font-size:9px;font-weight:700}.bg-green{background:#e8f5e9;color:#2e7d32}.bg-red{background:#ffebee;color:#c62828}.small{font-size:10px;color:#666;margin-top:3px}.actions{display:flex;gap:4px;margin-top:6px}.actions button{font-size:10px;padding:6px 8px;border-radius:6px;border:1px solid #ddd;background:#fff;font-weight:700}.water{background:#0288d1!important;color:#fff!important}.del{background:#ffebee!important;color:#c00!important}.ok{background:#1b4332!important;color:#fff!important}.fab{position:fixed;bottom:6px;left:6px;right:6px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;z-index:20}.fab button{padding:12px 2px;border:none;border-radius:10px;font-weight:800;color:#fff;font-size:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:end;z-index:50}.modal.on{display:flex}.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:14px;max-height:90vh;overflow:auto}.sheet label{font-size:11px;color:#666;display:block;margin-top:6px}.sheet input,.sheet select{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;margin:3px 0 6px;font-size:12px}.grid{display:flex;gap:6px}.grid>div{flex:1}.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:800;margin-top:6px}.save{background:#1b4332;color:#fff}.cancel{background:#eee}.statBox{background:#fff;padding:12px;border-radius:10px;margin-bottom:8px}</style></head><body><header><h1>🌿 مشتلتي - 4 اجزاء</h1><div class="row"><div class="pill"><b id="tPots">0</b>مكان</div><div class="pill"><b id="tAll">0</b>كلي</div><div class="pill"><b id="tCut">0</b>عقل</div><div class="pill"><b id="tYear">0</b>هالسنة</div></div></header><section><nav><button id="b1" class="on" onclick="setV('pots')">🗺️ أماكن</button><button id="b2" onclick="setV('seed')">🌱 بذر</button><button id="b3" onclick="setV('cut')">✂️ عقل</button><button id="b4" onclick="setV('buy')">🛒 شرا</button><button id="b5" onclick="setV('stats')" style="background:#ffebee">📈 رسم</button><button id="b6" onclick="setV('water')">💧 سقي</button></nav><input type="search" id="search" placeholder="🔍 بحث..." oninput="render()"><div id="list"></div></section><div class="fab"><button style="background:#1b4332" onclick="openPot()">+ مكان</button><button style="background:#2d6a4f" onclick="openSeed()">+ بذرة</button><button style="background:#6d4c41" onclick="openCut()">+ عقلة</button><button style="background:#7b1fa2" onclick="openSucker()">+ فرخة</button><button style="background:#ff6f00" onclick="openWild()">+ برّية</button><button style="background:#1565c0" onclick="openBuy()">+ شريتها</button></div><div class="modal" id="mPot"><div class="sheet"><h3>مكان</h3><label>اسم المكان</label><input id="pName"><label>وين</label><input id="pPlace"><input type="hidden" id="pEditId"><button class="btn save" onclick="savePot()">حفظ</button><button class="btn cancel" onclick="closeM('mPot')">الغاء</button></div></div><div class="modal" id="mSeed"><div class="sheet"><h3>بذرة</h3><div class="grid"><div><label>النوع</label><input id="sType"></div><div><label>العدد</label><input id="sQty" type="number" value="10"></div></div><label>المكان</label><select id="sPot"></select><div class="grid"><div><label>زراعة</label><input id="sDate" type="date"></div><div><label>نبّت؟</label><input id="sGermDate" type="date"></div></div><div class="grid"><div><label>كم نبّت</label><input id="sGermQty" type="number"></div><div><label>حالة</label><select id="sGermStatus"><option>لسا</option><option>بلش</option><option>كلو</option></select></div></div><input type="hidden" id="sEditId"><button class="btn save" onclick="saveSeed()">حفظ</button><button class="btn cancel" onclick="closeM('mSeed')">الغاء</button></div></div><div class="modal" id="mCut"><div class="sheet"><h3>عقلة</h3><div class="grid"><div><label>النوع</label><input id="cType"></div><div><label>العدد</label><input id="cQty" type="number" value="15"></div></div><label>المكان</label><select id="cPot"></select><div class="grid"><div><label>تاريخ</label><input id="cDate" type="date"></div><div><label>وقت</label><select id="cMonths"><option value="1">شهر</option><option value="2" selected>شهرين</option><option value="3">3 شهور</option></select></div></div><div class="grid"><div><label>سماكة</label><select id="cThick"><option>رفيع</option><option selected>وسط 10مم</option><option>سميك</option></select></div><div><label>طول</label><select id="cLen"><option>15 سم</option><option>20 سم</option></select></div></div><input type="hidden" id="cEditId"><button class="btn save" style="background:#6d4c41" onclick="saveCut()">حفظ</button><button class="btn cancel" onclick="closeM('mCut')">الغاء</button></div></div><div class="modal" id="mSucker"><div class="sheet"><h3>فرخة</h3><label>النوع</label><input id="kType"><label>العدد</label><input id="kQty" type="number" value="1"><label>المكان</label><select id="kPot"></select><label>التاريخ</label><input id="kDate" type="date"><button class="btn save" style="background:#7b1fa2" onclick="saveSucker()">حفظ</button><button class="btn cancel" onclick="closeM('mSucker')">الغاء</button></div></div><div class="modal" id="mWild"><div class="sheet"><h3>برّية</h3><label>النوع</label><input id="wType" value="رمان"><label>العدد</label><input id="wQty" type="number" value="1"><label>وين</label><input id="wWhere"><label>المكان</label><select id="wPot"></select><label>التاريخ</label><input id="wDate" type="date"><button class="btn save" style="background:#ff6f00" onclick="saveWild()">حفظ</button><button class="btn cancel" onclick="closeM('mWild')">الغاء</button></div></div><div class="modal" id="mBuy"><div class="sheet"><h3>شريتها</h3><label>النوع</label><input id="bType"><label>العدد</label><input id="bQty" type="number" value="1"><label>المكان</label><select id="bPot"></select><label>التاريخ</label><input id="bDate" type="date"><button class="btn save" style="background:#1565c0" onclick="saveBuy()">حفظ</button><button class="btn cancel" onclick="closeM('mBuy')">الغاء</button></div></div><div class="modal" id="mClose"><div class="sheet"><h3>كم نجح؟</h3><p id="closeInfo" class="small"></p><label>عدد الناجح</label><input id="closeSuccess" type="number"><button class="btn save" onclick="doClose()">حفظ</button><button class="btn cancel" onclick="closeM('mClose')">الغاء</button></div></div><script>
let pots=JSON.parse(localStorage.getItem('pro_pots')||'[]');
let seeds=JSON.parse(localStorage.getItem('pro_seed')||'[]');
let cuts=JSON.parse(localStorage.getItem('pro_cut')||'[]');
let buys=JSON.parse(localStorage.getItem('pro_buys')||'[]');
let view='pots', closeId=null, myChart=null, myChart2=null;
function setV(v){view=v;for(let i=1;i<=6;i++)document.getElementById('b'+i).className='';let map={pots:'b1',seed:'b2',cut:'b3',buy:'b4',stats:'b5',water:'b6'};document.getElementById(map[v]).className='on';render()}
function closeM(id){document.getElementById(id).classList.remove('on')}
function fillPots(){let o=pots.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')||'<option value="">ضيف مكان</option>';['sPot','cPot','kPot','wPot','bPot'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerHTML=o})}
function openPot(id){fillPots();if(id){let p=pots.find(x=>x.id==id);document.getElementById('pName').value=p.name;document.getElementById('pPlace').value=p.place;document.getElementById('pEditId').value=p.id}else{document.getElementById('pName').value='';document.getElementById('pPlace').value='';document.getElementById('pEditId').value=''}document.getElementById('mPot').classList.add('on')}
function savePot(){let eid=document.getElementById('pEditId').value;let n=document.getElementById('pName').value||'مكان '+(pots.length+1);let pl=document.getElementById('pPlace').value;if(eid){let p=pots.find(x=>x.id==eid);p.name=n;p.place=pl}else pots.push({id:Date.now(),name:n,place:pl});localStorage.setItem('pro_pots',JSON.stringify(pots));closeM('mPot');render()}
function openSeed(id){fillPots();if(id){let s=seeds.find(x=>x.id==id);document.getElementById('sType').value=s.type;document.getElementById('sQty').value=s.qty;document.getElementById('sPot').value=s.potId;document.getElementById('sDate').value=s.date;document.getElementById('sGermDate').value=s.germDate||'';document.getElementById('sGermQty').value=s.germQty||'';document.getElementById('sEditId').value=s.id}else{document.getElementById('sType').value='';document.getElementById('sQty').value=10;document.getElementById('sDate').valueAsDate=new Date();document.getElementById('sGermDate').value='';document.getElementById('sGermQty').value='';document.getElementById('sEditId').value=''}document.getElementById('mSeed').classList.add('on')}
function openCut(id){fillPots();if(id){let c=cuts.find(x=>x.id==id);document.getElementById('cType').value=c.type;document.getElementById('cQty').value=c.qty;document.getElementById('cPot').value=c.potId;document.getElementById('cDate').value=c.date;document.getElementById('cEditId').value=c.id}else{document.getElementById('cType').value='';document.getElementById('cQty').value=15;document.getElementById('cDate').valueAsDate=new Date();document.getElementById('cEditId').value=''}document.getElementById('mCut').classList.add('on')}
function openSucker(){fillPots();document.getElementById('kDate').valueAsDate=new Date();document.getElementById('mSucker').classList.add('on')}
function openWild(){fillPots();document.getElementById('wDate').valueAsDate=new Date();document.getElementById('mWild').classList.add('on')}
function openBuy(){fillPots();document.getElementById('bDate').valueAsDate=new Date();document.getElementById('mBuy').classList.add('on')}function saveSeed(){let eid=document.getElementById('sEditId').value;let obj={type:document.getElementById('sType').value||'غير محدد',qty:+(document.getElementById('sQty').value)||0,potId:document.getElementById('sPot').value,date:document.getElementById('sDate').value||new Date().toISOString().slice(0,10),germDate:document.getElementById('sGermDate').value||null,germQty:+(document.getElementById('sGermQty').value)||0,germStatus:document.getElementById('sGermStatus').value,lastWater:null};if(eid){Object.assign(seeds.find(x=>x.id==eid),obj)}else seeds.push({id:Date.now(),...obj});localStorage.setItem('pro_seed',JSON.stringify(seeds));closeM('mSeed');render()}
function saveCut(){let eid=document.getElementById('cEditId').value;let d=document.getElementById('cDate').value||new Date().toISOString().slice(0,10);let m=parseFloat(document.getElementById('cMonths').value);let exp=new Date(d);exp.setDate(exp.getDate()+m*30);let obj={type:document.getElementById('cType').value||'غير محدد',qty:+(document.getElementById('cQty').value)||0,potId:document.getElementById('cPot').value,date:d,months:m,exp:exp.toISOString().slice(0,10),thick:document.getElementById('cThick').value,len:document.getElementById('cLen').value,status:'قيد التجذير',success:0,lastWater:null};if(eid){let c=cuts.find(x=>x.id==eid);let st=c.status;let su=c.success;Object.assign(c,obj);c.status=st;c.success=su}else cuts.push({id:Date.now(),...obj});localStorage.setItem('pro_cut',JSON.stringify(cuts));closeM('mCut');render()}
function saveSucker(){seeds.push({id:Date.now(),type:(document.getElementById('kType').value||'فرخة')+' فرخة',qty:+(document.getElementById('kQty').value)||1,potId:document.getElementById('kPot').value,date:document.getElementById('kDate').value||new Date().toISOString().slice(0,10),kind:'sucker',lastWater:null});localStorage.setItem('pro_seed',JSON.stringify(seeds));closeM('mSucker');render()}
function saveWild(){seeds.push({id:Date.now(),type:(document.getElementById('wType').value||'رمان')+' برية',qty:+(document.getElementById('wQty').value)||1,potId:document.getElementById('wPot').value,where:document.getElementById('wWhere').value,date:document.getElementById('wDate').value||new Date().toISOString().slice(0,10),kind:'wild',lastWater:null});localStorage.setItem('pro_seed',JSON.stringify(seeds));closeM('mWild');render()}
function saveBuy(){buys.push({id:Date.now(),type:document.getElementById('bType').value||'شجرة',qty:+(document.getElementById('bQty').value)||1,potId:document.getElementById('bPot').value,date:document.getElementById('bDate').value||new Date().toISOString().slice(0,10),lastWater:null});localStorage.setItem('pro_buys',JSON.stringify(buys));closeM('mBuy');render()}
function daysAgo(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d))/86400000)}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000)}
function getPotName(id){let p=pots.find(x=>x.id==id);return p?p.name:'بدون'}
function delPot(id){if(!confirm('حذف؟'))return;pots=pots.filter(x=>x.id!=id);localStorage.setItem('pro_pots',JSON.stringify(pots));render()}
function delSeed(id){seeds=seeds.filter(x=>x.id!=id);localStorage.setItem('pro_seed',JSON.stringify(seeds));render()}
function delCut(id){cuts=cuts.filter(x=>x.id!=id);localStorage.setItem('pro_cut',JSON.stringify(cuts));render()}
function delBuy(id){buys=buys.filter(x=>x.id!=id);localStorage.setItem('pro_buys',JSON.stringify(buys));render()}
function waterOne(id,t){let d=new Date().toISOString().slice(0,10);let arr=t=='s'?seeds:t=='b'?buys:cuts;let o=arr.find(x=>x.id==id);if(o)o.lastWater=d;localStorage.setItem('pro_seed',JSON.stringify(seeds));localStorage.setItem('pro_cut',JSON.stringify(cuts));localStorage.setItem('pro_buys',JSON.stringify(buys));render()}
function waterPot(pid){let d=new Date().toISOString().slice(0,10);[...seeds,...cuts,...buys].forEach(x=>{if(x.potId==pid)x.lastWater=d});localStorage.setItem('pro_seed',JSON.stringify(seeds));localStorage.setItem('pro_cut',JSON.stringify(cuts));localStorage.setItem('pro_buys',JSON.stringify(buys));render()}
function openClose(id){closeId=id;document.getElementById('closeInfo').innerText=cuts.find(x=>x.id==id).type;document.getElementById('mClose').classList.add('on')}
function doClose(){let c=cuts.find(x=>x.id==closeId);c.success=+(document.getElementById('closeSuccess').value)||0;c.status='نجح';localStorage.setItem('pro_cut',JSON.stringify(cuts));closeM('mClose');render()}function render(){
let q=(document.getElementById('search').value||'').toLowerCase();
document.getElementById('tPots').innerText=pots.length;
let allC=seeds.reduce((s,x)=>s+x.qty,0)+cuts.filter(x=>x.status=='قيد التجذير').reduce((s,x)=>s+x.qty,0)+buys.reduce((s,x)=>s+x.qty,0);
document.getElementById('tAll').innerText=allC;
document.getElementById('tCut').innerText=cuts.reduce((s,x)=>s+x.qty,0);
let curY=new Date().getFullYear()+'';document.getElementById('tYear').innerText=[...seeds,...cuts,...buys].filter(x=>x.date.slice(0,4)==curY).reduce((s,x)=>s+x.qty,0);
let html='';

if(view=='stats'){
let all=[...seeds,...cuts,...buys];
let byYear={},byCut={};
all.forEach(x=>{let y=x.date.slice(0,4);if(!y)return;byYear[y]=(byYear[y]||0)+x.qty;if(cuts.find(c=>c.id==x.id))byCut[y]=(byCut[y]||0)+x.qty});
let years=Object.keys(byYear).sort();
let cumul=[];let t=0;years.forEach(y=>{t+=byYear[y];cumul.push(t)});
html='<div class=statBox><h3 style="font-size:12px">📈 كم شجرة بالسنة - تلقائي لحالو</h3><canvas id="cYear" height="200"></canvas></div><div class=statBox><h3 style="font-size:12px">✂️ كم شجرة عقلت كل سنة؟</h3><canvas id="cCut" height="180"></canvas></div><div class=statBox>';
years.forEach((y,i)=>{html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>📅 '+y+'</span><span>عقلت '+(byCut[y]||0)+' - مجموع '+byYear[y]+' - تراكمي '+cumul[i]+'</span></div>'});
html+='<div style="margin-top:8px;font-weight:800">المجموع: '+t+' - عقلت: '+cuts.reduce((s,x)=>s+x.qty,0)+'</div></div>';
document.getElementById('list').innerHTML=html;
setTimeout(()=>{
let e1=document.getElementById('cYear');if(e1){if(myChart)myChart.destroy();myChart=new Chart(e1,{type:'line',data:{labels:years,[STRIPPED] مجموع',data:cumul,[STRIPPED] عقلت',data:years.map(y=>byCut[y]||0),[STRIPPED] options:{responsive:true}})}});
let e2=document.getElementById('cCut');if(e2){if(myChart2)myChart2.destroy();myChart2=new Chart(e2,{type:'bar',data:{labels:years,[STRIPPED] عقلت',data:years.map(y=>byCut[y]||0),[STRIPPED] options:{responsive:true}})}});
},200);
return;
}

if(view=='pots'){
if(pots.length==0)html='<div class=card style="text-align:center">ما في أماكن<br><button class="btn save" onclick="openPot()">+ ضيف مكان</button></div>';
pots.filter(p=>!q||p.name.toLowerCase().includes(q)).slice().reverse().forEach(p=>{
let tot=seeds.filter(s=>s.potId==p.id).reduce((s,x)=>s+x.qty,0)+cuts.filter(c=>c.potId==p.id).reduce((s,x)=>s+x.qty,0)+buys.filter(b=>b.potId==p.id).reduce((s,x)=>s+x.qty,0);
html+='<div class=card><div class=top><b>🗺️ '+p.name+'</b><span class=badge>'+tot+'</span></div><div class=small>'+(p.place||'')+'</div><div class=actions><button class=water onclick="waterPot('+p.id+')">💧 سقي الكل</button><button onclick="openPot('+p.id+')">✏️</button><button class=del onclick="delPot('+p.id+')">🗑️</button></div></div>';
});
}
else if(view=='seed'){
seeds.filter(x=>!q||x.type.toLowerCase().includes(q)).slice().reverse().forEach(x=>{
html+='<div class=card><div class=top><b>🌱 '+x.type+' '+x.qty+'</b></div><div class=small>'+getPotName(x.potId)+' - '+x.date+'</div><div class=actions><button class=water onclick="waterOne('+x.id+',\'s\')">💧</button><button onclick="openSeed('+x.id+')">✏️</button><button class=del onclick="delSeed('+x.id+')">🗑️</button></div></div>';
});
}
else if(view=='cut'){
cuts.filter(x=>!q||x.type.toLowerCase().includes(q)).slice().reverse().forEach(x=>{
let left=daysBetween(new Date().toISOString().slice(0,10),x.exp);
html+='<div class=card><div class=top><b>✂️ '+x.type+' '+x.qty+'</b><span class=badge>باقي '+left+' يوم</span></div><div class=small>'+getPotName(x.potId)+' - '+x.thick+'</div><div class=actions><button class=water onclick="waterOne('+x.id+',\'c\')">💧</button><button class=ok onclick="openClose('+x.id+')">✅</button><button class=del onclick="delCut('+x.id+')">🗑️</button></div></div>';
});
}
else if(view=='buy'){
buys.slice().reverse().forEach(x=>{
html+='<div class=card><div class=top><b>🛒 '+x.type+' '+x.qty+'</b></div><div class=small>'+getPotName(x.potId)+' - '+x.date+'</div><div class=actions><button class=water onclick="waterOne('+x.id+',\'b\')">💧</button><button class=del onclick="delBuy('+x.id+')">🗑️</button></div></div>';
});
}
else if(view=='water'){
let all=[...seeds,...cuts,...buys];all.sort((a,b)=>daysAgo(b.lastWater)-daysAgo(a.lastWater));
all.forEach(x=>{
html+='<div class=card><div class=top><b>'+x.type+'</b><span class="badge '+(daysAgo(x.lastWater)>2?'bg-red':'bg-green')+'">'+daysAgo(x.lastWater)+' يوم</span></div><div class=actions><button class=water style="width:100%" onclick="waterOne('+x.id+',\''+(seeds.find(s=>s.id==x.id)?'s':buys.find(b=>b.id==x.id)?'b':'c')+'\')">💧 سقي الآن</button></div></div>';
});
}
document.getElementById('list').innerHTML=html;
}
render();
</script></body></html>
