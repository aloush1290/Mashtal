‏<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشتلتي - مع حساب العقل</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}body{background:#eef3e8;padding-bottom:120px}header{background:#1b4332;color:#fff;padding:10px;position:sticky;top:0;z-index:9}h1{font-size:12px}.row{display:flex;gap:3px;margin-top:5px}.pill{background:rgba(255,255,255,.15);padding:4px;border-radius:8px;flex:1;text-align:center;font-size:8px}.pill b{display:block;font-size:11px}section{padding:6px}nav{display:flex;gap:2px;margin-bottom:6px;overflow:auto}nav button{flex:1;padding:7px 2px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:8px;font-weight:700;white-space:nowrap}nav button.on{background:#1b4332;color:#fff}input[type=search]{width:100%;padding:7px;border:1px solid #ddd;border-radius:8px;margin-bottom:5px;font-size:10px}.card{background:#fff;border-radius:10px;padding:9px;margin-bottom:5px;box-shadow:0 1px 2px rgba(0,0,0,.06);border-right:4px solid #1b4332}.top{display:flex;justify-content:space-between;align-items:center;gap:3px}.badge{padding:2px 6px;border-radius:20px;font-size:8px;font-weight:700}.bg-green{background:#e8f5e9;color:#2e7d32}.bg-red{background:#ffebee;color:#c62828}.bg-blue{background:#e3f2fd;color:#1565c0}.bg-orange{background:#fff3e0;color:#ef6c00}.small{font-size:10px;color:#555;margin-top:2px;line-height:1.3}.progress{height:4px;background:#eee;border-radius:10px;margin-top:5px;overflow:hidden}.progress i{display:block;height:100%;background:#6d4c41}.actions{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}.actions button{font-size:9px;padding:5px 7px;border-radius:6px;border:1px solid #ddd;background:#fff;font-weight:700}.water{background:#0288d1!important;color:#fff!important}.del{background:#ffebee!important;color:#c62828!important}.ok{background:#1b4332!important;color:#fff!important}.edit{background:#fff3e0!important;color:#e65100!important}.fab{position:fixed;bottom:5px;left:5px;right:5px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;z-index:10}.fab button{padding:10px 1px;border:none;border-radius:9px;font-weight:800;color:#fff;font-size:9px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:end;z-index:30}.modal.on{display:flex}.sheet{background:#fff;width:100%;border-radius:14px 14px 0 0;padding:12px;max-height:93vh;overflow:auto}.sheet label{font-size:10px;color:#666;display:block;margin-top:5px}.sheet input,.sheet select{width:100%;padding:7px;border:1px solid #ddd;border-radius:7px;margin:2px 0 5px;font-size:11px}.grid{display:flex;gap:5px}.grid>div{flex:1}.btn{width:100%;padding:10px;border:none;border-radius:8px;font-weight:800;margin-top:5px;font-size:11px}.save{background:#1b4332;color:#fff}.cancel{background:#eee}.statBox{background:#fff;padding:10px;border-radius:10px;margin-bottom:6px}</style></head><body><header><h1>🌿 مشتلتي - بيحسب العقل بالسنة</h1><div class="row"><div class="pill"><b id="tPots">0</b>مكان</div><div class="pill"><b id="tAll">0</b>كلي</div><div class="pill"><b id="tCut">0</b>عقل</div><div class="pill"><b id="tYear">0</b>هالسنة</div></div></header><section><nav><button id="n1" class="on" onclick="setV('pots')">🗺️ أماكن</button><button id="n2" onclick="setV('seed')">🌱 بذر</button><button id="n3" onclick="setV('cut')">✂️ عقل</button><button id="n4" onclick="setV('buy')">🛒 شرا</button><button id="n5" onclick="setV('stats')" style="background:#ffebee">📈 رسم</button><button id="n6" onclick="setV('water')">💧 سقي</button></nav><input type="search" id="search" placeholder="🔍 بحث..." oninput="render()"><div id="list"></div></section><div class="fab"><button style="background:#1b4332" onclick="openPot()">+ مكان</button><button style="background:#2d6a4f" onclick="openSeed()">+ بذرة</button><button style="background:#6d4c41" onclick="openCut()">+ عقلة</button><button style="background:#7b1fa2" onclick="openSucker()">+ فرخة</button><button style="background:#ff6f00" onclick="openWild()">+ برّية</button><button style="background:#1565c0" onclick="openBuy()">+ شريتها</button></div><div class="modal" id="mPot"><div class="sheet"><h3 id="potTitle">مكان</h3><label>اسم المكان</label><input id="pName"><label>وين</label><input id="pPlace"><input type="hidden" id="pEditId"><button class="btn save" onclick="savePot()">حفظ</button><button class="btn cancel" onclick="closeM('mPot')">الغاء</button></div></div> <div class="modal" id="mSeed"><div class="sheet"><h3 id="seedTitle">بذرة + انبات</h3><div class="grid"><div><label>النوع</label><input id="sType"></div><div><label>العدد</label><input id="sQty" type="number" value="10"></div></div><label>المكان</label><select id="sPot"></select><div class="grid"><div><label>زراعة</label><input id="sDate" type="date"></div><div><label>نبّت؟</label><input id="sGermDate" type="date"></div></div><div class="grid"><div><label>كم نبّت</label><input id="sGermQty" type="number"></div><div><label>حالة</label><select id="sGermStatus"><option value="لسا ما نبّت">لسا</option><option value="بلش ينبت">بلش</option><option value="نبّت كلو">كلو</option></select></div></div><input type="hidden" id="sEditId"><button class="btn save" onclick="saveSeed()">حفظ</button><button class="btn cancel" onclick="closeM('mSeed')">الغاء</button></div></div><div class="modal" id="mCut"><div class="sheet"><h3 id="cutTitle">عقلة</h3><div class="grid"><div><label>النوع</label><input id="cType"></div><div><label>العدد</label><input id="cQty" type="number" value="15"></div></div><label>المكان</label><select id="cPot"></select><div class="grid"><div><label>تاريخ التعقيل</label><input id="cDate" type="date"></div><div><label>وقت</label><select id="cMonths"><option value="0.5">15 يوم</option><option value="1">شهر</option><option value="2" selected>شهرين</option><option value="3">3 شهور</option><option value="6">6 شهور</option></select></div></div><div class="grid"><div><label>سماكة</label><select id="cThick"><option>رفيع 5مم</option><option selected>وسط 10مم</option><option>سميك 15مم+</option></select></div><div><label>طول</label><select id="cLen"><option>10 سم</option><option selected>15 سم</option><option>20 سم</option></select></div></div><input type="hidden" id="cEditId"><button class="btn save" style="background:#6d4c41" onclick="saveCut()">حفظ</button><button class="btn cancel" onclick="closeM('mCut')">الغاء</button></div></div><div class="modal" id="mSucker"><div class="sheet"><h3>فرخة</h3><div class="grid"><div><label>النوع</label><input id="kType"></div><div><label>العدد</label><input id="kQty" type="number" value="1"></div></div><label>من وين</label><input id="kFrom"><label>المكان</label><select id="kPot"></select><label>التاريخ</label><input id="kDate" type="date"><button class="btn save" style="background:#7b1fa2" onclick="saveSucker()">حفظ</button><button class="btn cancel" onclick="closeM('mSucker')">الغاء</button></div></div><div class="modal" id="mWild"><div class="sheet"><h3>برّية</h3><div class="grid"><div><label>النوع</label><input id="wType" value="رمان"></div><div><label>العدد</label><input id="wQty" type="number" value="1"></div></div><label>وين لقيتها</label><input id="wWhere"><div class="grid"><div><label>بعدها</label><select id="wDist"><option>اقل من متر</option><option selected>1-2 متر</option><option>2-5 متر</option><option>اكتر من 5</option></select></div><div><label>حجمها</label><select id="wSize"><option>صغيرة</option><option selected>وسط</option><option>كبيرة</option></select></div></div><label>المكان</label><select id="wPot"></select><label>التاريخ</label><input id="wDate" type="date"><button class="btn save" style="background:#ff6f00" onclick="saveWild()">حفظ</button><button class="btn cancel" onclick="closeM('mWild')">الغاء</button></div></div><div class="modal" id="mBuy"><div class="sheet"><h3>شريتها</h3><div class="grid"><div><label>شو</label><input id="bType"></div><div><label>العدد</label><input id="bQty" type="number" value="1"></div></div><div class="grid"><div><label>من وين</label><input id="bFrom"></div><div><label>السعر</label><input id="bPrice" type="number"></div></div><label>المكان</label><select id="bPot"></select><label>التاريخ</label><input id="bDate" type="date"><input type="hidden" id="bEditId"><button class="btn save" style="background:#1565c0" onclick="saveBuy()">حفظ</button><button class="btn cancel" onclick="closeM('mBuy')">الغاء</button></div></div><div class="modal" id="mClose"><div class="sheet"><h3>كم عقلة نجحت؟</h3><p id="closeInfo" class="small"></p><label>كم نجح</label><input id="closeSuccess" type="number"><button class="btn save" onclick="doClose()">تسكير</button><button class="btn cancel" onclick="closeM('mClose')">الغاء</button></div></div> <script>let pots=JSON.parse(localStorage.getItem('pro_pots')||'[]');let seeds=JSON.parse(localStorage.getItem('pro_seed')||'[]');let cuts=JSON.parse(localStorage.getItem('pro_cut')||'[]');let buys=JSON.parse(localStorage.getItem('pro_buys')||'[]');let waters=JSON.parse(localStorage.getItem('pro_water')||'[]');let view='pots';let closeId=null;let myChart=null,myChart2=null;function setV(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.className='');let m={pots:'n1',seed:'n2',cut:'n3',buy:'n4',stats:'n5',water:'n6'};document.getElementById(m[v]).className='on';render()}function closeM(id){document.getElementById(id).classList.remove('on')}function fillPots(){let o=pots.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')||'<option value="">ضيف مكان</option>';['sPot','cPot','kPot','wPot','bPot'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerHTML=o})}function openPot(e=null){fillPots();if(e){let p=pots.find(x=>x.id==e);document.getElementById('pName').value=p.name;document.getElementById('pPlace').value=p.place;document.getElementById('pEditId').value=p.id;}else{document.getElementById('pName').value='';document.getElementById('pPlace').value='';document.getElementById('pEditId').value='';}document.getElementById('mPot').classList.add('on')}function savePot(){let eid=document.getElementById('pEditId').value;let n=document.getElementById('pName').value||`مكان ${pots.length+1}`;let pl=document.getElementById('pPlace').value;if(eid){let p=pots.find(x=>x.id==eid);p.name=n;p.place=pl;}else pots.push({id:Date.now(),name:n,place:pl});localStorage.setItem('pro_pots',JSON.stringify(pots));closeM('mPot');render()}function openSeed(e=null){fillPots();if(e){let s=seeds.find(x=>x.id==e);document.getElementById('sType').value=s.type;document.getElementById('sQty').value=s.qty;document.getElementById('sPot').value=s.potId;document.getElementById('sDate').value=s.date;document.getElementById('sGermDate').value=s.germDate||'';document.getElementById('sGermQty').value=s.germQty||'';document.getElementById('sEditId').value=s.id;}else{document.getElementById('sType').value='';document.getElementById('sQty').value=10;document.getElementById('sDate').valueAsDate=new Date();document.getElementById('sGermDate').value='';document.getElementById('sGermQty').value='';document.getElementById('sEditId').value='';}document.getElementById('mSeed').classList.add('on')}function openCut(e=null){fillPots();if(e){let c=cuts.find(x=>x.id==e);document.getElementById('cType').value=c.type;document.getElementById('cQty').value=c.qty;document.getElementById('cPot').value=c.potId;document.getElementById('cDate').value=c.date;document.getElementById('cEditId').value=c.id;}else{document.getElementById('cType').value='';document.getElementById('cQty').value=15;document.getElementById('cDate').valueAsDate=new Date();document.getElementById('cEditId').value='';}document.getElementById('mCut').classList.add('on')}function openSucker(){fillPots();document.getElementById('kDate').valueAsDate=new Date();document.getElementById('mSucker').classList.add('on')}function openWild(){fillPots();document.getElementById('wDate').valueAsDate=new Date();document.getElementById('mWild').classList.add('on')}function openBuy(){fillPots();document.getElementById('bDate').valueAsDate=new Date();document.getElementById('mBuy').classList.add('on')}function saveSeed(){let eid=document.getElementById('sEditId').value;let d={type:document.getElementById('sType').value||'غير محدد',qty:+document.getElementById('sQty').value||0,potId:document.getElementById('sPot').value,date:document.getElementById('sDate').value||new Date().toISOString().slice(0,10),germDate:document.getElementById('sGermDate').value||null,germQty:+document.getElementById('sGermQty').value||0,germStatus:document.getElementById('sGermStatus').value,lastWater:null};if(eid){Object.assign(seeds.find(x=>x.id==eid),d);}else seeds.push({id:Date.now(),...d});localStorage.setItem('pro_seed',JSON.stringify(seeds));closeM('mSeed');render()}function saveCut(){let eid=document.getElementById('cEditId').value;let d=document.getElementById('cDate').value||new Date().toISOString().slice(0,10);let m=parseFloat(document.getElementById('cMonths').value);let exp=new Date(d);exp.setDate(exp.getDate()+m*30);let obj={type:document.getElementById('cType').value||'غير محدد',qty:+document.getElementById('cQty').value||0,potId:document.getElementById('cPot').value,date:d,months:m,exp:exp.toISOString().slice(0,10),thick:document.getElementById('cThick').value,len:document.getElementById('cLen').value,status:'قيد التجذير',success:0,lastWater:null};if(eid){let c=cuts.find(x=>x.id==eid);Object.assign(c,obj);c.status='قيد التجذير';}else cuts.push({id:Date.now(),...obj});localStorage.setItem('pro_cut',JSON.stringify(cuts));closeM('mCut');render()}function saveSucker(){seeds.push({id:Date.now(),type:(document.getElementById('kType').value||'فرخة')+' فرخة',qty:+document.getElementById('kQty').value||1,potId:document.getElementById('kPot').value,from:document.getElementById('kFrom').value,date:document.getElementById('kDate').value||new Date().toISOString().slice(0,10),kind:'sucker',lastWater:null});localStorage.setItem('pro_seed',JSON.stringify(seeds));closeM('mSucker');render()}function saveWild(){seeds.push({id:Date.now(),type:(document.getElementById('wType').value||'رمان')+' برّية',qty:+document.getElementById('wQty').value||1,potId:document.getElementById('wPot').value,where:document.getElementById('wWhere').value,dist:document.getElementById('wDist').value,size:document.getElementById('wSize').value,date:document.getElementById('wDate').value||new Date().toISOString().slice(0,10),kind:'wild',lastWater:null});localStorage.setItem('pro_seed',JSON.stringify(seeds));closeM('mWild');render()}function saveBuy(){buys.push({id:Date.now(),type:document.getElementById('bType').value||'شجرة',qty:+document.getElementById('bQty').value||1,from:document.getElementById('bFrom').value,price:+document.getElementById('bPrice').value||0,potId:document.getElementById('bPot').value,date:document.getElementById('bDate').value||new Date().toISOString().slice(0,10),lastWater:null});localStorage.setItem('pro_buys',JSON.stringify(buys));closeM('mBuy');render()}function daysAgo(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d))/86400000)}function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000)}function getPotName(id){let p=pots.find(x=>x.id==id);return p?p.name:'بدون'}function delPot(id){if(!confirm('حذف؟'))return;pots=pots.filter(x=>x.id!=id);localStorage.setItem('pro_pots',JSON.stringify(pots));render()}function delSeed(id){seeds=seeds.filter(x=>x.id!=id);localStorage.setItem('pro_seed',JSON.stringify(seeds));render()}function delCut(id){cuts=cuts.filter(x=>x.id!=id);localStorage.setItem('pro_cut',JSON.stringify(cuts));render()}function delBuy(id){buys=buys.filter(x=>x.id!=id);localStorage.setItem('pro_buys',JSON.stringify(buys));render()}function waterOne(id,t){let d=new Date().toISOString().slice(0,10);waters.push({id:Date.now(),date:d});localStorage.setItem('pro_water',JSON.stringify(waters));let arr=t=='s'?seeds:t=='b'?buys:cuts;let o=arr.find(x=>x.id==id);if(o)o.lastWater=d;localStorage.setItem('pro_seed',JSON.stringify(seeds));localStorage.setItem('pro_cut',JSON.stringify(cuts));localStorage.setItem('pro_buys',JSON.stringify(buys));render()}function waterPot(pid){let d=new Date().toISOString().slice(0,10);[...seeds,...cuts,...buys].filter(x=>x.potId==pid).forEach(x=>x.lastWater=d);localStorage.setItem('pro_seed',JSON.stringify(seeds));localStorage.setItem('pro_cut',JSON.stringify(cuts));localStorage.setItem('pro_buys',JSON.stringify(buys));waters.push({id:Date.now(),date:d});localStorage.setItem('pro_water',JSON.stringify(waters));render()}function openClose(id){closeId=id;document.getElementById('closeInfo').innerText=cuts.find(x=>x.id==id).type;document.getElementById('mClose').classList.add('on')}function doClose(){let c=cuts.find(x=>x.id==closeId);c.success=+document.getElementById('closeSuccess').value||0;c.status='نجح';localStorage.setItem('pro_cut',JSON.stringify(cuts));closeM('mClose');render()} function render(){let q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('tPots').innerText=pots.length;let allC=seeds.reduce((s,x)=>s+x.qty,0)+cuts.filter(x=>x.status=='قيد التجذير').reduce((s,x)=>s+x.qty,0)+buys.reduce((s,x)=>s+x.qty,0);document.getElementById('tAll').innerText=allC;document.getElementById('tCut').innerText=cuts.reduce((s,x)=>s+x.qty,0);let curY=new Date().getFullYear()+'';document.getElementById('tYear').innerText=[...seeds,...cuts,...buys].filter(x=>x.date.slice(0,4)==curY).reduce((s,x)=>s+x.qty,0);let html='';if(view=='stats'){let all=[...seeds,...cuts,...buys];let byYear={},byCut={},bySeed={},byBuy={},byWild={};all.forEach(x=>{let y=x.date.slice(0,4);if(!y)return;byYear[y]=(byYear[y]||0)+x.qty;if(buys.find(b=>b.id==x.id))byBuy[y]=(byBuy[y]||0)+x.qty;else if(cuts.find(c=>c.id==x.id))byCut[y]=(byCut[y]||0)+x.qty;else if(x.kind=='wild')byWild[y]=(byWild[y]||0)+x.qty;else bySeed[y]=(bySeed[y]||0)+x.qty});let years=Object.keys(byYear).sort();let cumul=[];let t=0;years.forEach(y=>{t+=byYear[y];cumul.push(t)});let totalCut=cuts.reduce((s,x)=>s+x.qty,0);html+=`<div class=statBox><h3 style="font-size:12px">📈 كم شجرة بالسنة - تراكمي (تلقائي)</h3><p class=small>بحسب لحالو من تاريخ كل شجرة</p><canvas id="cYear" height="220"></canvas></div><div class=statBox><h3 style="font-size:12px">✂️ كم شجرة عقلت كل سنة؟</h3><p class=small>هاد الرسم بس للعقل</p><canvas id="cCut" height="200"></canvas></div><div class=statBox><h3 style="font-size:11px">📊 تفصيل كل سنة</h3>`;years.forEach((y,i)=>{html+=`<div style="padding:6px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between"><b style="font-size:11px">📅 ${y}</b><b style="font-size:11px">${byYear[y]} شجرة - مجموع ${cumul[i]}</b></div><div class=small>✂️ عقلت: ${byCut[y]||0} | 🌱 بذر/فرخ: ${bySeed[y]||0} | 🌳 برّية: ${byWild[y]||0} | 🛒 شريت: ${byBuy[y]||0}</div></div>`});html+=`</div><div class=statBox><h3>🔢 المجموع: ${t} شجرة</h3><div class=small>✂️ عقلت كلي: ${totalCut} شجرة</div><div class=small style="margin-top:4px;background:#e8f5e9;padding:6px;border-radius:6px">💡 ${t?Math.round(totalCut/t*100):0}% من مشتلك تعقيل ✂️</div></div>`;document.getElementById('list').innerHTML=html;setTimeout(()=>{let e1=document.getElementById('cYear');if(e1){if(myChart)myChart.destroy();myChart=new Chart(e1,{type:'line',data:{labels:years,[STRIPPED] المجموع الكلي',data:cumul,[STRIPPED] عقلت بهالسنة',data:years.map(y=>byCut[y]||0),[STRIPPED] بذر/فرخ',data:years.map(y=>bySeed[y]||0),[STRIPPED] options:{responsive:true,plugins:{legend:{labels:{font:{size:9}}}},scales:{y:{beginAtZero:true}}}})}});let e2=document.getElementById('cCut');if(e2){if(myChart2)myChart2.destroy();myChart2=new Chart(e2,{type:'bar',data:{labels:years,[STRIPPED] عقلت',data:years.map(y=>byCut[y]||0),[STRIPPED] options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}})},150);return}if(view=='pots'){pots.filter(p=>!q||p.name.toLowerCase().includes(q)).slice().reverse().forEach(p=>{let inS=seeds.filter(s=>s.potId==p.id);let inC=cuts.filter(c=>c.potId==p.id&&c.status=='قيد التجذير');let inB=buys.filter(b=>b.potId==p.id);let tot=inS.reduce((s,x)=>s+x.qty,0)+inC.reduce((s,x)=>s+x.qty,0)+inB.reduce((s,x)=>s+x.qty,0);html+=`<div class=card><div class=top><b>🗺️ ${p.name}</b><span class=badge>${tot}</span></div><div class=small>${p.place||''}</div><div class=actions><button class=water onclick="waterPot(${p.id})">💧 سقي الكل</button><button class=edit onclick="openPot(${p.id})">✏️</button><button class=del onclick="delPot(${p.id})">🗑️</button></div></div>`})}else if(view=='seed'){seeds.filter(x=>!q||x.type.toLowerCase().includes(q)).slice().reverse().forEach(x=>{html+=`<div class=card><div class=top><b>🌱 ${x.type} ${x.qty}</b></div><div class=small>${getPotName(x.potId)} - ${x.date}</div><div class=actions><button class=water onclick="waterOne(${x.id},'s')">💧</button><button class=del onclick="delSeed(${x.id})">🗑️</button></div></div>`})}else if(view=='cut'){cuts.filter(x=>!q||x.type.toLowerCase().includes(q)).slice().reverse().forEach(x=>{let left=daysBetween(new Date().toISOString().slice(0,10),x.exp);html+=`<div class=card><div class=top><b>✂️ ${x.type} ${x.qty}</b><span class=badge>${x.status=='قيد التجذير'?'باقي '+left+' يوم':'نجح '+x.success}</span></div><div class=small>${getPotName(x.potId)} - ${x.thick||''}</div><div class=actions><button class=water onclick="waterOne(${x.id},'c')">💧</button>${x.status=='قيد التجذير'?`<button class=ok onclick="openClose(${x.id})">✅</button>`:''}<button class=del onclick="delCut(${x.id})">🗑️</button></div></div>`})}else if(view=='buy'){buys.slice().reverse().forEach(x=>{html+=`<div class=card style="border-right-color:#1565c0"><div class=top><b>🛒 ${x.type} ${x.qty}</b></div><div class=small>${x.from||''} - ${x.price||0} ليرة</div><div class=actions><button class=water onclick="waterOne(${x.id},'b')">💧</button><button class=del onclick="delBuy(${x.id})">🗑️</button></div></div>`})}else{let all=[...seeds,...cuts.filter(x=>x.status=='قيد التجذير'),...buys];all.sort((a,b)=>daysAgo(b.lastWater)-daysAgo(a.lastWater));all.forEach(x=>{html+=`<div class=card><div class=top><b>${x.type}</b><span class="badge ${daysAgo(x.lastWater)>2?'bg-red':'bg-green'}">${daysAgo(x.lastWater)} يوم</span></div></div>`})}document.getElementById('list').innerHTML=html}render();</script></body></html>
